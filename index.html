<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app draw under the notch; safe areas are handled in the app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>DayLog</title>

    <!-- Installable app: "Add to Home Screen" opens full-screen instead of in the browser. -->
    <link rel="manifest" href="/Notes/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DayLog" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/Notes/apple-touch-icon.png?v=5" />
    <link rel="icon" type="image/png" href="/Notes/favicon.png?v=5" />
    <meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #F7F7F5;
      }
      /* Pin the page to the screen: only the app's own lists scroll, the page itself never moves or zooms. */
      html,
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #111114;
        }
      }
      body {
        overflow: hidden;
        /* No rubber-band bounce or double-tap zoom: feels like an app. */
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <meta name="theme-color" content="#F7F7F5">
<link rel="icon" href="/Notes/favicon.ico"/></head>

  <body>
    <noscript>You need to enable JavaScript to run DayLog.</noscript>
    <div id="root"></div>
    <script>
      // iPhone Safari ignores maximum-scale / user-scalable for pinch zoom, so block
      // two-finger gestures here. One-finger scrolling and taps are untouched.
      (function () {
        var stop = function (e) {
          e.preventDefault();
        };
        document.addEventListener('gesturestart', stop, { passive: false });
        document.addEventListener('gesturechange', stop, { passive: false });
        document.addEventListener('gestureend', stop, { passive: false });
        document.addEventListener(
          'touchmove',
          function (e) {
            if (e.touches.length > 1 || (typeof e.scale === 'number' && e.scale !== 1)) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
  <script src="/Notes/_expo/static/js/web/index-5be13a2becf12db90802043dcff5233a.js" defer></script>
</body>
</html>
